<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สรุปรายการสั่งซื้อและชำระเงิน</title>
    <style>
        body { font-family: 'Tahoma', sans-serif; background-color: #FAF4EB; margin: 0; padding: 0; }
        header { background-color: #E67E22; color: white; text-align: center; padding: 15px; font-size: 24px; font-weight: bold; }
        nav { background-color: #D35400; text-align: center; padding: 10px; }
        nav a { color: white; text-decoration: none; font-weight: bold; }
        .checkout-card { background: white; width: 500px; margin: 30px auto; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .summary { margin-top: 20px; background-color: #FFF3E0; padding: 15px; border-radius: 8px; }
        .summary p { display: flex; justify-content: space-between; margin: 5px 0; }
        .summary h3 { display: flex; justify-content: space-between; color: #C0392B; margin-top: 10px; border-top: 1px dashed #ccc; padding-top: 10px; }
        .btn-pay { width: 100%; background-color: #27AE60; color: white; border: none; padding: 12px; font-size: 18px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 15px; }
        .btn-pay:hover { background-color: #219150; }
    </style>
</head>
<body>

    <header>💳 ชำระเงิน</header>
    <nav>
        <a href="index.html">เลือกสินค้าเพิ่ม</a>
    </nav>

    <div class="checkout-card">
        <h2>สรุปรายการสั่งซื้อ</h2>
        
        <!-- รายการสินค้าจะถูกสร้างขึ้นด้วย JS -->
        <div id="order-items-list"></div>

        <div class="summary">
            <p>ยอดรวมสินค้า: <span><span id="subtotal">0</span> บาท</span></p>
            <p>ค่าจัดส่ง: <span>50 บาท</span></p>
            <h3>ยอดรวมสุทธิ: <span><span id="grand-total">0</span> บาท</span></h3>
        </div>

        <button class="btn-pay" onclick="alert('ขอบคุณสำหรับคำสั่งซื้อ!')">ยืนยันการชำระเงิน</button>
    </div>

    <script src="script.js"></script>
</body>
</html>

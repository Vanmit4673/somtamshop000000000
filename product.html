<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ระบุรายละเอียดส้มตำ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>🌶️ ระบุเครื่องส้มตำ</h1></header>
  <nav><a href="index.html">กลับหน้าแรก</a></nav>

  <div class="container" style="background:white; padding:20px; border-radius:12px;">
    <img id="p-image" src="" style="width:100%; max-height:300px; object-fit:cover; border-radius:8px;">
    <h2 id="p-name"></h2>
    <p id="p-desc" style="color:#666;"></p>
    <h3 class="price">ราคาเริ่มต้น <span id="p-price"></span> บาท</h3>
    <hr><br>

    <div class="form-group">
      <label>1. เลือกระดับความแซ่บ:</label>
      <select id="p-spicy"></select>
    </div>

    <div class="form-group">
      <label>2. เลือกตัวเลือกเส้น:</label>
      <select id="p-noodle"></select>
    </div>

    <div class="form-group">
      <label>3. เพิ่มท็อปปิ้งพิเศษ:</label>
      <div id="p-toppings"></div>
    </div>

    <button id="add-to-cart-btn" class="btn" style="width:100%;">ใส่ตะกร้าและไปชำระเงิน 🛒</button>
  </div>

  <script src="script.js"></script>
  <script>loadProductDetail();</script>
</body>
</html>

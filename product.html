<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบุเครื่องส้มตำ - ร้านตำนัว แซ่บนคร</title>
    <style>
        body { font-family: 'Tahoma', sans-serif; background-color: #FAF4EB; margin: 0; padding: 0; }
        header { background-color: #E67E22; color: white; text-align: center; padding: 15px; font-size: 24px; font-weight: bold; }
        nav { background-color: #D35400; text-align: center; padding: 10px; }
        nav a { color: white; text-decoration: none; font-weight: bold; }
        .form-card { background: white; width: 500px; margin: 30px auto; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .price { color: #C0392B; font-size: 18px; font-weight: bold; }
        select, input[type="text"] { width: 100%; padding: 10px; margin: 8px 0 20px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .topping-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .btn-submit { width: 100%; background-color: #E67E22; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; }
        .btn-submit:hover { background-color: #D35400; }
    </style>
</head>
<body>

    <header>🌶️ ระบุเครื่องส้มตำ</header>
    <nav>
        <a href="index.html">กลับหน้าแรก</a>
    </nav>

    <div class="form-card">
        <!-- ชื่อและราคาจะเปลี่ยนตามเมนูที่กดเลือก -->
        <h2 id="product-name">กำลังโหลดรายการ...</h2>
        <p class="price">ราคาเริ่มต้น <span id="product-price">0</span> บาท</p>
        <hr><br>

        <form id="customize-form">
            <label><b>1. เล่อร์ระดับความแซ่บ:</b></label>
            <select id="spicy-level">
                <option value="">-- กรุณาเลือกระดับความเผ็ด --</option>
                <option value="ไม่เผ็ด">ไม่เผ็ด</option>
                <option value="เผ็ดน้อย">เผ็ดน้อย</option>
                <option value="เผ็ดปานกลาง">เผ็ดปานกลาง</option>
                <option value="เผ็ดมาก">เผ็ดมาก</option>
            </select>

            <label><b>2. เลือกตัวเลือกเส้น:</b></label>
            <select id="noodle-type">
                <option value="">-- กรุณาเลือกเส้น --</option>
                <option value="เส้นมะละกอ">เส้นมะละกอ</option>
                <option value="เส้นขนมจีน">เส้นขนมจีน</option>
                <option value="เส้นมาม่า">เส้นมาม่า</option>
            </select>

            <label><b>3. เพิ่มท็อปปิ้งพิเศษ:</b></label><br><br>
            <div class="topping-item">
                <label for="top1">แคบหมูกรอบ (+15 บาท)</label>
                <input type="checkbox" id="top1" class="topping" value="แคบหมูกรอบ" data-price="15">
            </div>
            <div class="topping-item">
                <label for="top2">หมูกรอบ (+30 บาท)</label>
                <input type="checkbox" id="top2" class="topping" value="หมูกรอบ" data-price="30">
            </div>
            <div class="topping-item">
                <label for="top3">กุ้งสด (+40 บาท)</label>
                <input type="checkbox" id="top3" class="topping" value="กุ้งสด" data-price="40">
            </div>
            <div class="topping-item">
                <label for="top4">ไข่เค็ม (+15 บาท)</label>
                <input type="checkbox" id="top4" class="topping" value="ไข่เค็ม" data-price="15">
            </div>
            <div class="topping-item">
                <label for="top5">ต้มแซ่บกระดูกอ่อน (+50 บาท)</label>
                <input type="checkbox" id="top5" class="topping" value="ต้มแซ่บกระดูกอ่อน" data-price="50">
            </div>

            <br>
            <button type="button" class="btn-submit" onclick="submitOrder()">ใส่ตะกร้าและไปชำระเงิน 🛒</button>
        </form>
    </div>

    <!-- เรียกใช้ไฟล์สคริปต์ -->
    <script src="script.js"></script>
</body>
</html>
